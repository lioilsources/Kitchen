# Folklore Garden: menu restaurace ze společného katalogu menus/praha/dishes.yaml (zdroj: menu k folklorní show, bez cen).
#   make run CONFIG=menus/praha/folklore-garden.yaml
# Položka menu potřebuje jen sku; stanici, čas apod. lze přepsat přímo tady.
listen: ":8088"
data_file: "folklore-garden.db"
art_dir: "art/praha"
catalog: dishes.yaml
stations:
  - {id: gril,    name: Gril,     parallelism: 4}
  - {id: teple,   name: Teplá,    parallelism: 3}
  - {id: studena, name: Studená,  parallelism: 2}
  - {id: dezert,  name: Dezerty,  parallelism: 2}
course_names: {1: předkrm, 2: hlavní, 3: dezert}
menu:
  - {sku: syrova-pomazanka}
  - {sku: bramboracka}
  - {sku: tradicni-misa}
  - {sku: pecene-kure}
  - {sku: falafel}
  - {sku: veprove-koleno}
  - {sku: losos-gril}
  - {sku: pstruh-gril}
  - {sku: kureci-spiz}
  - {sku: strudl}
  - {sku: kachni-stehno}
tts: {engine: say, say_voice: Zuzana, output: play, play_cmd: [afplay]}
escpos: {enabled: true, listen: ":9100", forward: "", charset: cp852}
