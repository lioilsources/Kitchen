# Pražská restaurace: menu poskládané z jídelních lístků skutečných pražských podniků (zdroj u každého bloku).
#   make run CONFIG=config.praha.yaml   →  http://localhost:8088
# name = krátký název na displeje, aliases = celý název z lístku (tak chodí z pokladny na bonu).
# Fotky jídel: art/praha/<sku>.jpg (FLUX.1-schnell, viz art/praha/README.md); dokud chybí, displeje ukazují emoji.
listen: ":8088"
data_file: "praha.db"
art_dir: "art/praha"
stations:
