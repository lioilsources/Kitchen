<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Předávka — expo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><h1>Předávka</h1><span class="sp"></span>
  <button id="quiet">Tichý režim</button><button id="repeat">Ještě jednou</button><span class="dot"></span></header>
<main><div class="pass" id="cards"></div></main>
<div class="caption"></div>
<div class="offline">Spojení se serverem ztraceno…</div>
<script src="app.js"></script>
<script>
let quiet = false;
function render(s) {
  quiet = s.quiet;
  document.getElementById("quiet").textContent = quiet ? "Zapnout hlas" : "Tichý režim";
  const byTable = {};
  for (const it of s.items) (byTable[it.table] ||= []).push(it);
  const cards = s.tables.map((t) => {
    const its = byTable[t.table] || [];
    const hasHold = its.some((i) => i.status === "HOLD");
    const hasReady = its.some((i) => i.status === "READY");
    const cls = t.status === "ready" ? "ready" : "";
    const alert = t.alert !== "none" ? ` ${t.alert} breathe` : "";
    const sub = t.status === "ready" ? `hotovo ${P.mins(t.ready_wait_s)} min`
      : t.status === "hold" ? "čeká na chod" : `≈ ${t.eta_min} min · ${t.items_ready}/${t.items_total}`;
    return `<div class="card ${cls}${alert}">
      <h2>${P.esc(t.table)} <small>${sub}</small></h2>
      <ul>${its.map((i) => `<li class="${i.status}">${P.pic(i)}${i.qty}× ${P.esc(i.name)} <span class="muted">· ${P.statusCs[i.status]}${i.course > 1 ? ` · ${i.course}. chod` : ""}</span></li>`).join("")}</ul>
      <div class="actions">
        ${hasReady ? `<button class="primary" data-t="${P.esc(t.table)}" data-a="pick">Vyzvednuto</button>` : ""}
        ${hasHold ? `<button data-t="${P.esc(t.table)}" data-a="fire">Fire další chod</button>` : ""}
      </div></div>`;
  });
  document.getElementById("cards").innerHTML = cards.join("") || `<p class="muted" style="font-size:24px">Nic na předávce.</p>`;
}
document.getElementById("cards").addEventListener("click", async (ev) => {
  const b = ev.target.closest("button[data-a]");
  if (!b) return;
  try { await P.post(`/api/tables/${encodeURIComponent(b.dataset.t)}/${b.dataset.a}`); } catch (e) { P.toast(e.message); }
});
document.getElementById("repeat").onclick = () => P.post("/api/repeat");
document.getElementById("quiet").onclick = () => P.post("/api/quiet", { on: !quiet });
P.connect(render, (a) => P.caption(a.text));
</script>
</body>
</html>
