<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plac — Předávka</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><h1 data-i18n="modeFloor">Plac</h1><span class="sp"></span><span class="muted" id="clock"></span><span class="dot"></span></header>
<main class="floor"><table><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden><img class="empty-art" src="art/chef.png" alt="" onerror="this.remove()"><span data-i18n="allServed">Vše vydáno.</span></div></main>
<div class="caption"></div>
<div class="offline" data-i18n="offlineBanner">Spojení se serverem ztraceno…</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
function state(t) {
  switch (t.status) {
    case "ready": return { eta: "", label: T("tableReady") + (t.ready_wait_s >= 60 ? ` · ${T("minutesShort", { min: P.mins(t.ready_wait_s) })}` : "") };
    case "partial": return { eta: t.eta_min > 0 ? T("etaInMin", { min: t.eta_min }) : T("etaSoon"), label: T("partialCount", { ready: t.items_ready, total: t.items_total }) };
    case "hold": return { eta: "", label: T("statusHold") };
    case "waiting": return { eta: T("etaInMin", { min: t.eta_min }), label: T("tableWaiting") };
    default: return { eta: t.eta_min > 0 ? T("etaInMin", { min: t.eta_min }) : T("etaSoon"), label: T("statusCooking") };
  }
}
function render(s) {
  document.getElementById("clock").textContent = new Date(s.now).toLocaleTimeString(I18N.locale, { hour: "2-digit", minute: "2-digit" });
  const rows = s.tables.map((t) => {
    const st = state(t);
    const items = t.items.map((i) => `${P.pic(i)}${i.qty}× ${P.esc(i.name)}`).join(", ");
    const alert = t.alert !== "none" ? ` ${t.alert} breathe` : "";
    return `<tr class="${t.status}${alert}"><td>${P.esc(t.table)}</td><td><div class="items">${items}</div></td>
      <td><div class="eta">${st.eta}</div><div class="state">${st.label}</div></td></tr>`;
  });
  document.getElementById("rows").innerHTML = rows.join("");
  document.getElementById("empty").hidden = rows.length > 0;
}
I18N.ready.then(() => {
  document.title = T("modeFloor") + " — Předávka";
  P.connect(render, (a) => P.caption(a.text));
});
</script>
</body>
</html>
