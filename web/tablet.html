<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablet — Předávka</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar"><h1>Nová objednávka</h1><span class="sp"></span><span class="dot"></span></header>
<main class="grid2">
  <section>
    <div class="menu-btns" id="menu"></div>
  </section>
  <section class="panel cart">
    <div class="form-row"><label for="table">Stůl</label><input id="table" inputmode="numeric" size="6" autofocus></div>
    <div class="form-row"><label for="note">Poznámka</label><input id="note" style="flex:1"></div>
    <ul id="lines"></ul>
    <div class="form-row"><button class="primary" id="send">Odeslat do kuchyně</button><button id="clear">Vymazat</button></div>
  </section>
</main>
<div class="offline">Spojení se serverem ztraceno…</div>
<script src="app.js"></script>
<script>
let menu = [], lines = [];
function renderLines() {
  document.getElementById("lines").innerHTML = lines.map((l, i) => `<li>
    <span>${l.qty}× ${P.esc(l.name)}${l.mods.length ? ` <span class="muted">(${P.esc(l.mods.join(", "))})</span>` : ""}
      <span class="muted">· ${l.course}. chod</span></span>
    <span><button data-i="${i}" data-a="mod">úprava</button> <button data-i="${i}" data-a="course">chod</button>
      <button data-i="${i}" data-a="minus">−</button></span></li>`).join("") || `<li class="muted">Prázdné</li>`;
}
P.get("/api/menu").then((m) => {
  menu = m;
  document.getElementById("menu").innerHTML = m.map((x, i) =>
    `<button data-i="${i}">${P.esc(x.name)}<small>${P.esc(x.station)} · ${x.course}. chod</small></button>`).join("");
});
document.getElementById("menu").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const m = menu[+b.dataset.i];
  const ex = lines.find((l) => l.sku === m.sku && l.mods.length === 0);
  if (ex) ex.qty++; else lines.push({ sku: m.sku, name: m.name, qty: 1, mods: [], course: m.course });
  renderLines();
});
document.getElementById("lines").addEventListener("click", (ev) => {
  const b = ev.target.closest("button");
  if (!b) return;
  const l = lines[+b.dataset.i];
  if (b.dataset.a === "minus") { if (--l.qty <= 0) lines.splice(+b.dataset.i, 1); }
  else if (b.dataset.a === "course") l.course = l.course % 3 + 1;
  else if (b.dataset.a === "mod") {
    const input = document.createElement("input");
    input.placeholder = "např. bez cibule";
    b.replaceWith(input);
    input.focus();
    input.onkeydown = (e) => { if (e.key === "Enter") { if (input.value.trim()) l.mods.push(input.value.trim()); renderLines(); } };
    input.onblur = () => renderLines();
    return;
  }
  renderLines();
});
document.getElementById("clear").onclick = () => { lines = []; renderLines(); };
document.getElementById("send").onclick = async () => {
  const table = document.getElementById("table").value.trim();
  if (!table) return P.toast("Zadej číslo stolu");
  if (!lines.length) return P.toast("Objednávka je prázdná");
  try {
    await P.post("/api/orders", { table, source: "tablet", note: document.getElementById("note").value.trim(),
      items: lines.map((l) => ({ sku: l.sku, qty: l.qty, mods: l.mods, course: l.course })) });
    P.toast(`Stůl ${table} odeslán`);
    lines = []; renderLines();
    document.getElementById("table").value = ""; document.getElementById("note").value = "";
  } catch (e) { P.toast(e.message); }
};
renderLines();
P.connect(() => {});
</script>
</body>
</html>
